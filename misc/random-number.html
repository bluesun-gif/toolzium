<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Number Generator | Toolzium</title>
  <meta name="description" content="Generate random numbers easily. Set min/max, generate multiple, allow/disallow duplicates.">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .container { max-width: 600px; margin: 2rem auto; padding: 2rem; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h1 { text-align: center; margin-bottom: 2rem; }
    .form-group { display: flex; flex-direction: column; margin-bottom: 1.5rem; }
    .form-group label { font-weight: bold; margin-bottom: 0.5rem; }
    .form-row { display: flex; gap: 1rem; }
    .form-row .form-group { flex: 1; }
    input[type="number"] { padding: 0.8rem; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
    .checkbox-group { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; }
    .btn { display: block; width: 100%; padding: 1rem; border: none; background: #007bff; color: #fff; border-radius: 6px; font-size: 1.2rem; cursor: pointer; transition: background 0.3s; margin-top: 1rem; }
    .btn:hover { background: #0056b3; }
    .result-box { margin-top: 2rem; padding: 1.5rem; background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; text-align: center; font-size: 1.5rem; word-break: break-all; min-height: 80px; }
    .error { color: #dc3545; font-size: 0.9rem; margin-top: 0.5rem; display: none; }
  </style>
</head>
<body>
  <header>
    <div class="navbar">
      <a href="/" class="logo">Toolzium</a>
      <nav class="nav-links">
        <a href="/pdf/">PDF</a>
        <a href="/image/">Image</a>
        <a href="/text/">Text</a>
        <a href="/developer/">Developer</a>
        <a href="/calculator/">Calculator</a>
        <a href="/converter/">Converter</a>
        <a href="/ai/">AI Tools</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Random Number Generator</h1>
    
    <div class="form-row">
      <div class="form-group">
        <label for="minVal">Min</label>
        <input type="number" id="minVal" value="1">
      </div>
      <div class="form-group">
        <label for="maxVal">Max</label>
        <input type="number" id="maxVal" value="100">
      </div>
    </div>
    
    <div class="form-group">
      <label for="countVal">How many numbers?</label>
      <input type="number" id="countVal" value="1" min="1" max="1000">
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="noDuplicates">
      <label for="noDuplicates">No Duplicates</label>
    </div>
    
    <div class="checkbox-group">
      <input type="checkbox" id="sortResults">
      <label for="sortResults">Sort Results</label>
    </div>

    <div class="error" id="errorMsg"></div>

    <button class="btn" onclick="generate()">Generate</button>

    <div class="result-box" id="resultBox">
      Click generate to get numbers
    </div>
  </main>

  <footer>
    <div class="privacy-badge">🔒 Your data never leaves your device.</div>
    <div class="footer-links">
      <a href="/">Home</a><a href="/about.html">About</a><a href="/privacy.html">Privacy</a>
    </div>
    <p class="copyright">&copy; 2026 Toolzium. All rights reserved.</p>
  </footer>

  <script>
    function generate() {
      const min = parseInt(document.getElementById('minVal').value);
      const max = parseInt(document.getElementById('maxVal').value);
      const count = parseInt(document.getElementById('countVal').value);
      const noDuplicates = document.getElementById('noDuplicates').checked;
      const sortResults = document.getElementById('sortResults').checked;
      const resultBox = document.getElementById('resultBox');
      const errorMsg = document.getElementById('errorMsg');

      errorMsg.style.display = 'none';

      if (isNaN(min) || isNaN(max) || isNaN(count)) {
        showError("Please enter valid numbers.");
        return;
      }
      if (min > max) {
        showError("Min cannot be greater than Max.");
        return;
      }
      if (count < 1) {
        showError("Count must be at least 1.");
        return;
      }
      
      const range = max - min + 1;
      if (noDuplicates && count > range) {
        showError(`Cannot generate ${count} unique numbers in a range of ${range}.`);
        return;
      }

      let results = [];
      if (noDuplicates) {
        const pool = new Set();
        while (pool.size < count) {
          const r = Math.floor(Math.random() * range) + min;
          pool.add(r);
        }
        results = Array.from(pool);
      } else {
        for (let i = 0; i < count; i++) {
          results.push(Math.floor(Math.random() * range) + min);
        }
      }

      if (sortResults) {
        results.sort((a, b) => a - b);
      }

      resultBox.innerText = results.join(', ');
    }

    function showError(msg) {
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.innerText = msg;
      errorMsg.style.display = 'block';
    }
  </script>
</body>
</html>
