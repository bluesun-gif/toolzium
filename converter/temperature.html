<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter - Toolzium</title>
    <meta name="description" content="Free online temperature converter. Convert between Celsius, Fahrenheit, and Kelvin. Includes a visual thermometer.">
    <link rel="stylesheet" href="/css/style.css">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Temperature Converter",
      "url": "https://toolzium.com/converter/temperature.html",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "All",
      "description": "Convert temperatures instantly between Celsius, Fahrenheit, and Kelvin."
    }
    </script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f9fafb; color: #111827; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: #ffffff; border-bottom: 1px solid #e5e7eb; }
        .logo { font-size: 1.5rem; font-weight: bold; text-decoration: none; color: #2563eb; }
        .nav-links a { margin-left: 1rem; text-decoration: none; color: #4b5563; font-weight: 500; }
        .nav-links a:hover { color: #2563eb; }
        footer { padding: 2rem; text-align: center; background: #ffffff; border-top: 1px solid #e5e7eb; margin-top: auto; }
        .footer-links a { margin: 0 0.5rem; text-decoration: none; color: #6b7280; }
        .privacy-badge { margin-bottom: 1rem; font-size: 0.875rem; color: #059669; font-weight: 500; background: #ecfdf5; display: inline-block; padding: 0.25rem 0.75rem; border-radius: 9999px; }
        .copyright { margin-top: 1rem; font-size: 0.875rem; color: #9ca3af; }
        
        main { flex: 1; padding: 2rem; display: flex; justify-content: center; align-items: flex-start; }
        .tool-container { width: 100%; max-width: 600px; background: #ffffff; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        h1 { text-align: center; font-size: 1.875rem; margin-bottom: 1.5rem; color: #1f2937; }
        
        .temp-grid { display: grid; gap: 1rem; }
        .input-group { display: flex; flex-direction: column; gap: 0.5rem; }
        label { font-weight: 500; font-size: 0.875rem; color: #374151; }
        input[type="number"] { padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1.25rem; outline: none; transition: border-color 0.2s; }
        input[type="number"]:focus { border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1); }

        .visual-thermometer { margin-top: 2rem; text-align: center; }
        .thermometer-body { width: 40px; height: 200px; background: #e5e7eb; border-radius: 20px 20px 0 0; margin: 0 auto; position: relative; border: 3px solid #d1d5db; border-bottom: none; overflow: hidden; }
        .thermometer-fluid { position: absolute; bottom: 0; left: 0; right: 0; background: #ef4444; transition: height 0.3s ease, background-color 0.3s ease; height: 50%; }
        .thermometer-bulb { width: 60px; height: 60px; background: #ef4444; border-radius: 50%; margin: -10px auto 0; border: 3px solid #d1d5db; position: relative; z-index: 1; transition: background-color 0.3s ease; }
    </style>
</head>
<body>
    <header>
      <div class="navbar">
        <a href="/" class="logo">Toolzium</a>
        <nav class="nav-links">
          <a href="/pdf/">PDF</a>
          <a href="/image/">Image</a>
          <a href="/text/">Text</a>
          <a href="/developer/">Developer</a>
          <a href="/calculator/">Calculator</a>
          <a href="/converter/">Converter</a>
          <a href="/ai/">AI Tools</a>
        </nav>
      </div>
    </header>

    <main>
        <div class="tool-container">
            <h1>Temperature Converter</h1>
            <div class="temp-grid">
                <div class="input-group">
                    <label for="celsius">Celsius (°C)</label>
                    <input type="number" id="celsius" value="20" step="any" oninput="convert('C')">
                </div>
                <div class="input-group">
                    <label for="fahrenheit">Fahrenheit (°F)</label>
                    <input type="number" id="fahrenheit" step="any" oninput="convert('F')">
                </div>
                <div class="input-group">
                    <label for="kelvin">Kelvin (K)</label>
                    <input type="number" id="kelvin" step="any" oninput="convert('K')">
                </div>
            </div>

            <div class="visual-thermometer">
                <div class="thermometer-body">
                    <div class="thermometer-fluid" id="fluid"></div>
                </div>
                <div class="thermometer-bulb" id="bulb"></div>
            </div>
        </div>
    </main>

    <footer>
      <div class="privacy-badge">🔒 Your data never leaves your device.</div>
      <div class="footer-links">
        <a href="/">Home</a><a href="/about.html">About</a><a href="/privacy.html">Privacy</a>
      </div>
      <p class="copyright">&copy; 2026 Toolzium. All rights reserved.</p>
    </footer>

    <script>
        const celsiusInput = document.getElementById('celsius');
        const fahrenheitInput = document.getElementById('fahrenheit');
        const kelvinInput = document.getElementById('kelvin');
        const fluid = document.getElementById('fluid');
        const bulb = document.getElementById('bulb');

        function updateThermometer(celsius) {
            // Range from -30C to 50C for visual
            let percentage = ((celsius + 30) / 80) * 100;
            percentage = Math.max(5, Math.min(percentage, 100)); // clamp
            fluid.style.height = `${percentage}%`;

            let color = '#ef4444'; // Red
            if (celsius <= 0) color = '#3b82f6'; // Blue
            else if (celsius <= 15) color = '#10b981'; // Green
            else if (celsius <= 30) color = '#f59e0b'; // Orange

            fluid.style.backgroundColor = color;
            bulb.style.backgroundColor = color;
        }

        function convert(source) {
            let c, f, k;
            
            if (source === 'C') {
                c = parseFloat(celsiusInput.value);
                if (isNaN(c)) return clearInputs('C');
                f = (c * 9/5) + 32;
                k = c + 273.15;
            } else if (source === 'F') {
                f = parseFloat(fahrenheitInput.value);
                if (isNaN(f)) return clearInputs('F');
                c = (f - 32) * 5/9;
                k = c + 273.15;
            } else if (source === 'K') {
                k = parseFloat(kelvinInput.value);
                if (isNaN(k)) return clearInputs('K');
                c = k - 273.15;
                f = (c * 9/5) + 32;
            }

            if (source !== 'C') celsiusInput.value = parseFloat(c.toFixed(4));
            if (source !== 'F') fahrenheitInput.value = parseFloat(f.toFixed(4));
            if (source !== 'K') kelvinInput.value = parseFloat(k.toFixed(4));

            updateThermometer(c);
        }

        function clearInputs(except) {
            if (except !== 'C') celsiusInput.value = '';
            if (except !== 'F') fahrenheitInput.value = '';
            if (except !== 'K') kelvinInput.value = '';
        }

        convert('C');
    </script>
</body>
</html>
