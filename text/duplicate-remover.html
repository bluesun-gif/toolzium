<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duplicate Line Remover - Toolzium</title>
    <meta name="description" content="Remove duplicate lines from text automatically.">
    <link rel="stylesheet" href="/css/style.css">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Duplicate Line Remover",
      "applicationCategory": "UtilitiesApplication",
      "offers": {
        "@type": "Offer",
        "price": "0"
      }
    }
    </script>
</head>
<body>
    <header>
      <div class="navbar">
        <a href="/" class="logo">Toolzium</a>
        <nav class="nav-links">
          <a href="/pdf/">PDF</a>
          <a href="/image/">Image</a>
          <a href="/text/" class="active">Text</a>
          <a href="/developer/">Developer</a>
          <a href="/calculator/">Calculator</a>
          <a href="/converter/">Converter</a>
          <a href="/ai/">AI Tools</a>
        </nav>
      </div>
    </header>

    <main class="tool-workspace">
        <div class="tool-container">
            <h1>Duplicate Line Remover</h1>
            
            <textarea id="input" class="tool-input" placeholder="Paste text with duplicate lines..."></textarea>
            <div style="margin-bottom:15px; display:flex; gap:20px; align-items:center;">
                <button class="btn-primary" onclick="removeDups()" style="margin:0;">Remove Duplicates</button>
                <span style="font-size:18px;">Removed: <b id="removed-count">0</b></span>
            </div>
            <textarea id="output" class="output-area" readonly placeholder="Result..."></textarea>
            <button class="btn-secondary" onclick="navigator.clipboard.writeText(document.getElementById('output').value)">Copy Result</button>
        
            <div class="ad-placeholder" style="margin-top: 20px; padding: 20px; background: #333; text-align: center; border: 1px dashed #666; min-height: 90px; color: #888;">
                AdSense Placeholder
            </div>
        </div>
    </main>

    <footer>
      <div class="privacy-badge">🔒 Your data never leaves your device.</div>
      <div class="footer-links">
        <a href="/">Home</a><a href="/about.html">About</a><a href="/privacy.html">Privacy</a>
      </div>
      <p class="copyright">&copy; 2026 Toolzium. All rights reserved.</p>
    </footer>

    <script>

            function removeDups() {
                const text = document.getElementById('input').value;
                if(!text) return;
                const lines = text.split('\n');
                const unique = [...new Set(lines)];
                document.getElementById('output').value = unique.join('\n');
                document.getElementById('removed-count').innerText = lines.length - unique.length;
            }
        
    </script>
</body>
</html>
