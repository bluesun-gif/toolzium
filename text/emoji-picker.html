<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Picker - Toolzium</title>
    <meta name="description" content="Searchable emoji grid. Click to copy.">
    <link rel="stylesheet" href="/css/style.css">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Emoji Picker",
      "applicationCategory": "UtilitiesApplication",
      "offers": {
        "@type": "Offer",
        "price": "0"
      }
    }
    </script>
</head>
<body>
    <header>
      <div class="navbar">
        <a href="/" class="logo">Toolzium</a>
        <nav class="nav-links">
          <a href="/pdf/">PDF</a>
          <a href="/image/">Image</a>
          <a href="/text/" class="active">Text</a>
          <a href="/developer/">Developer</a>
          <a href="/calculator/">Calculator</a>
          <a href="/converter/">Converter</a>
          <a href="/ai/">AI Tools</a>
        </nav>
      </div>
    </header>

    <main class="tool-workspace">
        <div class="tool-container">
            <h1>Emoji Picker</h1>
            
            <input type="text" id="search" class="tool-input" placeholder="Search emojis (e.g., smile, animal)..." style="min-height:auto;">
            <div style="margin-bottom:15px; display:flex; gap:10px;">
                <button class="btn-secondary" onclick="render('smile')">Smileys</button>
                <button class="btn-secondary" onclick="render('animal')">Animals</button>
                <button class="btn-secondary" onclick="render('food')">Food</button>
                <button class="btn-secondary" onclick="render('')">All</button>
            </div>
            <div id="grid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap:10px; max-height:400px; overflow-y:auto; background:#222; padding:15px; border-radius:4px; font-size:30px; text-align:center;"></div>
            <div id="msg" style="margin-top:10px; color:#4caf50; font-weight:bold;"></div>
        
            <div class="ad-placeholder" style="margin-top: 20px; padding: 20px; background: #333; text-align: center; border: 1px dashed #666; min-height: 90px; color: #888;">
                AdSense Placeholder
            </div>
        </div>
    </main>

    <footer>
      <div class="privacy-badge">🔒 Your data never leaves your device.</div>
      <div class="footer-links">
        <a href="/">Home</a><a href="/about.html">About</a><a href="/privacy.html">Privacy</a>
      </div>
      <p class="copyright">&copy; 2026 Toolzium. All rights reserved.</p>
    </footer>

    <script>

            const emojis = [
                {c:'😀', tags:['smile','happy']}, {c:'😃', tags:['smile']}, {c:'😄', tags:['smile','laugh']}, {c:'😁', tags:['smile']}, {c:'😆', tags:['smile','laugh']}, {c:'😅', tags:['smile','sweat']}, {c:'😂', tags:['laugh','cry']}, {c:'🤣', tags:['laugh']}, {c:'🥲', tags:['smile','tear']}, {c:'☺️', tags:['smile']},
                {c:'🐶', tags:['animal','dog']}, {c:'🐱', tags:['animal','cat']}, {c:'🐭', tags:['animal','mouse']}, {c:'🐹', tags:['animal','hamster']}, {c:'🐰', tags:['animal','rabbit']}, {c:'🦊', tags:['animal','fox']}, {c:'🐻', tags:['animal','bear']}, {c:'🐼', tags:['animal','panda']},
                {c:'🍎', tags:['food','apple']}, {c:'🍐', tags:['food','pear']}, {c:'🍊', tags:['food','orange']}, {c:'🍋', tags:['food','lemon']}, {c:'🍌', tags:['food','banana']}, {c:'🍉', tags:['food','watermelon']}, {c:'🍇', tags:['food','grape']}, {c:'🍓', tags:['food','strawberry']}
            ];
            function render(filter = '') {
                const g = document.getElementById('grid');
                g.innerHTML = '';
                filter = filter.toLowerCase();
                for(let e of emojis) {
                    if(!filter || e.tags.some(t => t.includes(filter))) {
                        const d = document.createElement('div');
                        d.innerText = e.c;
                        d.style.cursor = 'pointer';
                        d.onmouseover = () => d.style.background = '#444';
                        d.onmouseout = () => d.style.background = 'transparent';
                        d.onclick = () => {
                            navigator.clipboard.writeText(e.c);
                            document.getElementById('msg').innerText = 'Copied: ' + e.c;
                            setTimeout(()=>document.getElementById('msg').innerText='', 2000);
                        };
                        g.appendChild(d);
                    }
                }
            }
            render();
            document.getElementById('search').addEventListener('input', (e) => render(e.target.value));
        
    </script>
</body>
</html>
