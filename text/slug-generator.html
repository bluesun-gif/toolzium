<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Slug Generator - Toolzium</title>
    <meta name="description" content="Convert any string to a URL-friendly slug.">
    <link rel="stylesheet" href="/css/style.css">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "URL Slug Generator",
      "applicationCategory": "UtilitiesApplication",
      "offers": {
        "@type": "Offer",
        "price": "0"
      }
    }
    </script>
</head>
<body>
    <header>
      <div class="navbar">
        <a href="/" class="logo">Toolzium</a>
        <nav class="nav-links">
          <a href="/pdf/">PDF</a>
          <a href="/image/">Image</a>
          <a href="/text/" class="active">Text</a>
          <a href="/developer/">Developer</a>
          <a href="/calculator/">Calculator</a>
          <a href="/converter/">Converter</a>
          <a href="/ai/">AI Tools</a>
        </nav>
      </div>
    </header>

    <main class="tool-workspace">
        <div class="tool-container">
            <h1>URL Slug Generator</h1>
            
            <textarea id="input" class="tool-input" placeholder="Enter text to convert to slug..."></textarea>
            <div style="margin-bottom:15px; display:flex; gap:20px; align-items:center;">
                <label>Separator: 
                    <select id="sep" class="tool-input" style="min-height:auto; width:auto; display:inline-block; margin:0 0 0 10px; padding:5px;">
                        <option value="-">Dash (-)</option>
                        <option value="_">Underscore (_)</option>
                    </select>
                </label>
                <label><input type="checkbox" id="lowercase" checked> Lowercase</label>
            </div>
            <button class="btn-primary" onclick="gen()">Generate Slug</button>
            <textarea id="output" class="output-area" readonly placeholder="your-slug-here"></textarea>
            <button class="btn-secondary" onclick="navigator.clipboard.writeText(document.getElementById('output').value)">Copy Result</button>
        
            <div class="ad-placeholder" style="margin-top: 20px; padding: 20px; background: #333; text-align: center; border: 1px dashed #666; min-height: 90px; color: #888;">
                AdSense Placeholder
            </div>
        </div>
    </main>

    <footer>
      <div class="privacy-badge">🔒 Your data never leaves your device.</div>
      <div class="footer-links">
        <a href="/">Home</a><a href="/about.html">About</a><a href="/privacy.html">Privacy</a>
      </div>
      <p class="copyright">&copy; 2026 Toolzium. All rights reserved.</p>
    </footer>

    <script>

            function gen() {
                let t = document.getElementById('input').value;
                const sep = document.getElementById('sep').value;
                if(document.getElementById('lowercase').checked) t = t.toLowerCase();
                document.getElementById('output').value = t.replace(/[^a-zA-Z0-9]+/g, sep).replace(new RegExp('^' + sep + '|' + sep + '$', 'g'), '');
            }
        
    </script>
</body>
</html>
