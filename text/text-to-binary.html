<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Binary Converter - Toolzium</title>
    <meta name="description" content="Convert text to binary and binary to text. Also show Hex and Octal.">
    <link rel="stylesheet" href="/css/style.css">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Text to Binary Converter",
      "applicationCategory": "UtilitiesApplication",
      "offers": {
        "@type": "Offer",
        "price": "0"
      }
    }
    </script>
</head>
<body>
    <header>
      <div class="navbar">
        <a href="/" class="logo">Toolzium</a>
        <nav class="nav-links">
          <a href="/pdf/">PDF</a>
          <a href="/image/">Image</a>
          <a href="/text/" class="active">Text</a>
          <a href="/developer/">Developer</a>
          <a href="/calculator/">Calculator</a>
          <a href="/converter/">Converter</a>
          <a href="/ai/">AI Tools</a>
        </nav>
      </div>
    </header>

    <main class="tool-workspace">
        <div class="tool-container">
            <h1>Text to Binary Converter</h1>
            
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-bottom:15px;">
                <div>
                    <h3>Text Input</h3>
                    <textarea id="text" class="tool-input" placeholder="Type text..."></textarea>
                </div>
                <div>
                    <h3>Binary Output</h3>
                    <textarea id="bin" class="tool-input" placeholder="Type binary to convert back..."></textarea>
                </div>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                <div>
                    <h3>Hexadecimal</h3>
                    <textarea id="hex" class="output-area" readonly></textarea>
                </div>
                <div>
                    <h3>Octal</h3>
                    <textarea id="oct" class="output-area" readonly></textarea>
                </div>
            </div>
        
            <div class="ad-placeholder" style="margin-top: 20px; padding: 20px; background: #333; text-align: center; border: 1px dashed #666; min-height: 90px; color: #888;">
                AdSense Placeholder
            </div>
        </div>
    </main>

    <footer>
      <div class="privacy-badge">🔒 Your data never leaves your device.</div>
      <div class="footer-links">
        <a href="/">Home</a><a href="/about.html">About</a><a href="/privacy.html">Privacy</a>
      </div>
      <p class="copyright">&copy; 2026 Toolzium. All rights reserved.</p>
    </footer>

    <script>

            document.getElementById('text').addEventListener('input', function() {
                const t = this.value;
                let b = [], h = [], o = [];
                for(let i=0; i<t.length; i++) {
                    const c = t.charCodeAt(i);
                    b.push(c.toString(2).padStart(8, '0'));
                    h.push(c.toString(16).padStart(2, '0'));
                    o.push(c.toString(8));
                }
                document.getElementById('bin').value = b.join(' ');
                document.getElementById('hex').value = h.join(' ');
                document.getElementById('oct').value = o.join(' ');
            });
            document.getElementById('bin').addEventListener('input', function() {
                const b = this.value.trim().split(/\s+/);
                try {
                    document.getElementById('text').value = b.map(c => String.fromCharCode(parseInt(c, 2))).join('');
                } catch(e) {}
            });
        
    </script>
</body>
</html>
