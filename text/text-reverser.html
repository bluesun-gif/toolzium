<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Reverser - Toolzium</title>
    <meta name="description" content="Reverse text, words, or letters online.">
    <link rel="stylesheet" href="/css/style.css">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Text Reverser",
      "applicationCategory": "UtilitiesApplication",
      "offers": {
        "@type": "Offer",
        "price": "0"
      }
    }
    </script>
</head>
<body>
    <header>
      <div class="navbar">
        <a href="/" class="logo">Toolzium</a>
        <nav class="nav-links">
          <a href="/pdf/">PDF</a>
          <a href="/image/">Image</a>
          <a href="/text/" class="active">Text</a>
          <a href="/developer/">Developer</a>
          <a href="/calculator/">Calculator</a>
          <a href="/converter/">Converter</a>
          <a href="/ai/">AI Tools</a>
        </nav>
      </div>
    </header>

    <main class="tool-workspace">
        <div class="tool-container">
            <h1>Text Reverser</h1>
            
            <textarea id="input" class="tool-input" placeholder="Enter text to reverse..."></textarea>
            <div style="display:flex; gap:10px; margin-bottom:15px; flex-wrap:wrap;">
                <button class="btn-primary" onclick="rev('full')">Reverse Entire Text</button>
                <button class="btn-primary" onclick="rev('words')">Reverse Words Order</button>
                <button class="btn-primary" onclick="rev('each')">Reverse Each Word</button>
            </div>
            <textarea id="output" class="output-area" readonly placeholder="Result..."></textarea>
            <button class="btn-secondary" onclick="navigator.clipboard.writeText(document.getElementById('output').value)">Copy Result</button>
        
            <div class="ad-placeholder" style="margin-top: 20px; padding: 20px; background: #333; text-align: center; border: 1px dashed #666; min-height: 90px; color: #888;">
                AdSense Placeholder
            </div>
        </div>
    </main>

    <footer>
      <div class="privacy-badge">🔒 Your data never leaves your device.</div>
      <div class="footer-links">
        <a href="/">Home</a><a href="/about.html">About</a><a href="/privacy.html">Privacy</a>
      </div>
      <p class="copyright">&copy; 2026 Toolzium. All rights reserved.</p>
    </footer>

    <script>

            function rev(mode) {
                const t = document.getElementById('input').value;
                let r = '';
                if(mode === 'full') r = t.split('').reverse().join('');
                else if(mode === 'words') r = t.split(' ').reverse().join(' ');
                else if(mode === 'each') r = t.split(' ').map(w => w.split('').reverse().join('')).join(' ');
                document.getElementById('output').value = r;
            }
        
    </script>
</body>
</html>
