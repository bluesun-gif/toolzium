<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Password Generator - Generate Strong Passwords | Toolzium</title>
    <meta name="description" content="Generate highly secure, random passwords with custom lengths and character types. Fast, free, and operates entirely in your browser.">
    <link rel="stylesheet" href="/css/style.css">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Secure Password Generator",
      "operatingSystem": "Any",
      "applicationCategory": "SecurityApplication",
      "description": "Generate highly secure, random passwords with custom lengths and character types.",
      "url": "https://toolzium.com/security/password-generator.html"
    }
    </script>
    <style>
        .tool-container { max-width: 800px; margin: 2rem auto; padding: 2rem; background: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .control-group { margin-bottom: 1.5rem; }
        .control-group label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        .slider-container { display: flex; align-items: center; gap: 1rem; }
        input[type="range"] { flex: 1; }
        .checkbox-group { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }
        .output-container { margin-top: 2rem; position: relative; }
        textarea { width: 100%; height: 150px; padding: 1rem; font-family: monospace; font-size: 1.1rem; border: 1px solid #ccc; border-radius: 4px; resize: vertical; box-sizing: border-box; }
        .btn { padding: 0.75rem 1.5rem; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: bold; }
        .btn-primary { background: #007bff; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        .actions { display: flex; gap: 1rem; margin-top: 1rem; }
        .strength-meter { height: 10px; background: #e9ecef; border-radius: 5px; margin-top: 0.5rem; overflow: hidden; }
        .strength-bar { height: 100%; width: 0; transition: width 0.3s, background-color 0.3s; }
        .flex-row { display: flex; gap: 1rem; align-items: center; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #f4f7f6; color: #333; margin: 0; }
        header .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: #222; color: #fff; }
        header .logo { font-size: 1.5rem; font-weight: bold; color: #fff; text-decoration: none; }
        header .nav-links a { color: #ccc; text-decoration: none; margin-left: 1rem; }
        header .nav-links a:hover { color: #fff; }
        footer { text-align: center; padding: 2rem; background: #222; color: #ccc; margin-top: 3rem; }
        footer a { color: #ccc; margin: 0 1rem; text-decoration: none; }
        footer a:hover { color: #fff; }
        .privacy-badge { margin-bottom: 1rem; font-weight: bold; color: #28a745; }
    </style>
</head>
<body>
    <header>
      <div class="navbar">
        <a href="/" class="logo">Toolzium</a>
        <nav class="nav-links">
          <a href="/pdf/">PDF</a>
          <a href="/image/">Image</a>
          <a href="/text/">Text</a>
          <a href="/developer/">Developer</a>
          <a href="/calculator/">Calculator</a>
          <a href="/converter/">Converter</a>
          <a href="/ai/">AI Tools</a>
        </nav>
      </div>
    </header>

    <main class="tool-container">
        <h1>Secure Password Generator</h1>
        
        <div class="control-group">
            <label>Password Length: <span id="length-val">16</span></label>
            <div class="slider-container">
                <input type="range" id="length" min="4" max="128" value="16">
            </div>
        </div>

        <div class="control-group checkbox-group">
            <label><input type="checkbox" id="uppercase" checked> Uppercase (A-Z)</label>
            <label><input type="checkbox" id="lowercase" checked> Lowercase (a-z)</label>
            <label><input type="checkbox" id="numbers" checked> Numbers (0-9)</label>
            <label><input type="checkbox" id="symbols" checked> Symbols (!@#$%^&*)</label>
        </div>

        <div class="control-group flex-row">
            <label for="count" style="margin:0;">Number of Passwords:</label>
            <input type="number" id="count" min="1" max="100" value="1" style="width: 80px; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
        </div>

        <div class="control-group">
            <label>Password Strength</label>
            <div class="strength-meter">
                <div class="strength-bar" id="strength-bar"></div>
            </div>
            <small id="strength-text">Strong</small>
        </div>

        <div class="actions">
            <button class="btn btn-primary" id="generate-btn">Generate Passwords</button>
            <button class="btn btn-secondary" id="copy-btn">Copy to Clipboard</button>
        </div>

        <div class="output-container">
            <textarea id="output" readonly placeholder="Your generated passwords will appear here..."></textarea>
        </div>
    </main>

    <footer>
      <div class="privacy-badge">🔒 Your data never leaves your device.</div>
      <div class="footer-links">
        <a href="/">Home</a><a href="/about.html">About</a><a href="/privacy.html">Privacy</a>
      </div>
      <p class="copyright">&copy; 2026 Toolzium. All rights reserved.</p>
    </footer>

    <script>
        const lengthSlider = document.getElementById('length');
        const lengthVal = document.getElementById('length-val');
        const uppercaseCb = document.getElementById('uppercase');
        const lowercaseCb = document.getElementById('lowercase');
        const numbersCb = document.getElementById('numbers');
        const symbolsCb = document.getElementById('symbols');
        const countInput = document.getElementById('count');
        const generateBtn = document.getElementById('generate-btn');
        const copyBtn = document.getElementById('copy-btn');
        const output = document.getElementById('output');
        const strengthBar = document.getElementById('strength-bar');
        const strengthText = document.getElementById('strength-text');

        const chars = {
            uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            lowercase: 'abcdefghijklmnopqrstuvwxyz',
            numbers: '0123456789',
            symbols: '!@#$%^&*()_+~`|}{[]:;?><,./-='
        };

        lengthSlider.addEventListener('input', (e) => {
            lengthVal.textContent = e.target.value;
            updateStrength();
        });

        [uppercaseCb, lowercaseCb, numbersCb, symbolsCb].forEach(cb => {
            cb.addEventListener('change', updateStrength);
        });

        function updateStrength() {
            const length = parseInt(lengthSlider.value);
            let types = 0;
            if(uppercaseCb.checked) types++;
            if(lowercaseCb.checked) types++;
            if(numbersCb.checked) types++;
            if(symbolsCb.checked) types++;

            let score = 0;
            if (length > 8) score += 1;
            if (length > 12) score += 1;
            if (length >= 16) score += 1;
            if (types === 2) score += 1;
            if (types === 3) score += 2;
            if (types === 4) score += 3;

            let color = '#dc3545'; // red
            let text = 'Weak';
            let width = '25%';

            if (score >= 4) {
                color = '#28a745'; // green
                text = 'Strong';
                width = '100%';
            } else if (score >= 2) {
                color = '#ffc107'; // yellow
                text = 'Medium';
                width = '60%';
            }

            if (types === 0) {
                width = '0%';
                text = 'Invalid options';
            }

            strengthBar.style.width = width;
            strengthBar.style.backgroundColor = color;
            strengthText.textContent = text;
        }

        function generate() {
            let charset = '';
            if(uppercaseCb.checked) charset += chars.uppercase;
            if(lowercaseCb.checked) charset += chars.lowercase;
            if(numbersCb.checked) charset += chars.numbers;
            if(symbolsCb.checked) charset += chars.symbols;

            if (!charset) {
                alert('Please select at least one character type.');
                return;
            }

            const length = parseInt(lengthSlider.value);
            const count = parseInt(countInput.value) || 1;
            let result = '';

            for (let j = 0; j < count; j++) {
                let password = '';
                const randomValues = new Uint32Array(length);
                window.crypto.getRandomValues(randomValues);
                for (let i = 0; i < length; i++) {
                    password += charset[randomValues[i] % charset.length];
                }
                result += password + '\n';
            }

            output.value = result.trim();
            updateStrength();
        }

        generateBtn.addEventListener('click', generate);

        copyBtn.addEventListener('click', () => {
            if(!output.value) return;
            output.select();
            document.execCommand('copy');
            const originalText = copyBtn.textContent;
            copyBtn.textContent = 'Copied!';
            setTimeout(() => copyBtn.textContent = originalText, 2000);
        });

        generate();
    </script>
</body>
</html>
