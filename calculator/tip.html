<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tip Calculator | Toolzium</title>
  <meta name="description" content="Calculate tip amounts and split the bill easily among friends.">
  <link rel="stylesheet" href="/css/style.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Tip Calculator",
    "description": "Calculate tips and split bills per person.",
    "applicationCategory": "FinanceApplication"
  }
  </script>
  <style>
    .calculator-container { max-width: 500px; margin: 40px auto; padding: 30px; background: #fff; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); font-family: system-ui, sans-serif; }
    h1 { text-align: center; color: #333; margin-bottom: 25px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
    input[type="number"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 1.1rem; box-sizing: border-box; }
    
    .tip-buttons { display: flex; gap: 10px; margin-bottom: 10px; }
    .tip-btn { flex: 1; padding: 10px; background: #f8f9fa; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; font-weight: bold; color: #333; transition: all 0.2s; }
    .tip-btn.active, .tip-btn:hover { background: #007bff; color: white; border-color: #007bff; }

    button.calc-btn { width: 100%; padding: 14px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1.1rem; font-weight: bold; transition: background 0.3s; margin-top: 10px; }
    button.calc-btn:hover { background: #218838; }
    
    .results { margin-top: 30px; display: none; }
    .res-card { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; }
    .res-card .label { font-size: 1rem; color: #666; font-weight: 600; }
    .res-card .val { font-size: 1.4rem; font-weight: bold; color: #333; }
    .res-card.highlight { background: #e8f4fd; border-color: #b8daff; }
    .res-card.highlight .val { color: #007bff; font-size: 1.8rem; }
  </style>
</head>
<body>
  <header>
    <div class="navbar">
      <a href="/" class="logo">Toolzium</a>
      <nav class="nav-links">
        <a href="/pdf/">PDF</a>
        <a href="/image/">Image</a>
        <a href="/text/">Text</a>
        <a href="/developer/">Developer</a>
        <a href="/calculator/">Calculator</a>
        <a href="/converter/">Converter</a>
        <a href="/ai/">AI Tools</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="calculator-container">
      <h1>Tip Calculator</h1>
      <div class="form-group">
        <label>Bill Amount ($)</label>
        <input type="number" id="bill" placeholder="e.g. 50">
      </div>
      
      <div class="form-group">
        <label>Tip Percentage (%)</label>
        <div class="tip-buttons">
          <button class="tip-btn" onclick="setTip(10)">10%</button>
          <button class="tip-btn active" onclick="setTip(15)">15%</button>
          <button class="tip-btn" onclick="setTip(18)">18%</button>
          <button class="tip-btn" onclick="setTip(20)">20%</button>
        </div>
        <input type="number" id="tip" value="15" placeholder="Custom Tip %">
      </div>

      <div class="form-group">
        <label>Number of People</label>
        <input type="number" id="people" value="1" min="1">
      </div>

      <button class="calc-btn" onclick="calculateTip()">Calculate</button>

      <div class="results" id="results">
        <div class="res-card">
          <span class="label">Total Tip</span>
          <span class="val" id="res-tip-total"></span>
        </div>
        <div class="res-card">
          <span class="label">Total Bill (with tip)</span>
          <span class="val" id="res-bill-total"></span>
        </div>
        <div class="res-card highlight" id="per-person-card">
          <span class="label">Amount per Person</span>
          <span class="val" id="res-per-person"></span>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="privacy-badge">🔒 Your data never leaves your device.</div>
    <div class="footer-links">
      <a href="/">Home</a><a href="/about.html">About</a><a href="/privacy.html">Privacy</a>
    </div>
    <p class="copyright">&copy; 2026 Toolzium. All rights reserved.</p>
  </footer>

  <script>
    function setTip(val) {
      document.getElementById('tip').value = val;
      document.querySelectorAll('.tip-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }

    // listen for custom input to remove active class from preset buttons
    document.getElementById('tip').addEventListener('input', () => {
      document.querySelectorAll('.tip-btn').forEach(btn => btn.classList.remove('active'));
    });

    function calculateTip() {
      const bill = parseFloat(document.getElementById('bill').value);
      const tipPerc = parseFloat(document.getElementById('tip').value);
      let people = parseInt(document.getElementById('people').value);

      if(isNaN(bill) || isNaN(tipPerc) || bill < 0 || tipPerc < 0) return alert("Please enter valid positive numbers.");
      if(isNaN(people) || people < 1) people = 1;

      const tipAmount = bill * (tipPerc / 100);
      const totalBill = bill + tipAmount;
      const perPerson = totalBill / people;

      document.getElementById('res-tip-total').innerText = '$' + tipAmount.toFixed(2);
      document.getElementById('res-bill-total').innerText = '$' + totalBill.toFixed(2);
      
      const ppCard = document.getElementById('per-person-card');
      if(people > 1) {
        document.getElementById('res-per-person').innerText = '$' + perPerson.toFixed(2);
        ppCard.style.display = 'flex';
      } else {
        ppCard.style.display = 'none';
      }

      document.getElementById('results').style.display = 'block';
    }
  </script>
</body>
</html>
