<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discount Calculator | Toolzium</title>
  <meta name="description" content="Calculate the final price after discount and find out exactly how much you save.">
  <link rel="stylesheet" href="/css/style.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Discount Calculator",
    "description": "Calculate discount price and savings.",
    "applicationCategory": "FinanceApplication"
  }
  </script>
  <style>
    .calculator-container { max-width: 500px; margin: 40px auto; padding: 30px; background: #fff; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); font-family: system-ui, sans-serif; }
    h1 { text-align: center; color: #333; margin-bottom: 25px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
    input[type="number"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 1.1rem; box-sizing: border-box; }
    button { width: 100%; padding: 14px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1.1rem; font-weight: bold; transition: background 0.3s; margin-top: 10px; }
    button:hover { background: #0056b3; }
    
    .results { margin-top: 30px; display: none; border-top: 2px dashed #eee; padding-top: 25px; }
    .result-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 1.2rem; }
    .result-row .label { color: #666; font-weight: 600; }
    .result-row .val { font-weight: bold; color: #333; }
    .result-row.final { font-size: 1.6rem; color: #28a745; }
    .result-row.final .val { color: #28a745; }
    .result-row.savings { color: #dc3545; }
  </style>
</head>
<body>
  <header>
    <div class="navbar">
      <a href="/" class="logo">Toolzium</a>
      <nav class="nav-links">
        <a href="/pdf/">PDF</a>
        <a href="/image/">Image</a>
        <a href="/text/">Text</a>
        <a href="/developer/">Developer</a>
        <a href="/calculator/">Calculator</a>
        <a href="/converter/">Converter</a>
        <a href="/ai/">AI Tools</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="calculator-container">
      <h1>Discount Calculator</h1>
      <div class="form-group">
        <label>Original Price</label>
        <input type="number" id="price" placeholder="e.g. 100">
      </div>
      <div class="form-group">
        <label>Discount Percentage (%)</label>
        <input type="number" id="discount" placeholder="e.g. 20">
      </div>
      <button onclick="calculateDiscount()">Calculate Final Price</button>

      <div class="results" id="results">
        <div class="result-row">
          <span class="label">Original Price:</span>
          <span class="val" id="res-original"></span>
        </div>
        <div class="result-row savings">
          <span class="label">You Save:</span>
          <span class="val" id="res-saved"></span>
        </div>
        <div class="result-row final">
          <span class="label">Final Price:</span>
          <span class="val" id="res-final"></span>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="privacy-badge">🔒 Your data never leaves your device.</div>
    <div class="footer-links">
      <a href="/">Home</a><a href="/about.html">About</a><a href="/privacy.html">Privacy</a>
    </div>
    <p class="copyright">&copy; 2026 Toolzium. All rights reserved.</p>
  </footer>

  <script>
    function calculateDiscount() {
      const price = parseFloat(document.getElementById('price').value);
      const discount = parseFloat(document.getElementById('discount').value);

      if(isNaN(price) || isNaN(discount)) return alert("Please enter valid numbers.");
      if(price < 0 || discount < 0 || discount > 100) return alert("Please enter valid positive values (discount 0-100).");

      const saved = price * (discount / 100);
      const finalPrice = price - saved;

      document.getElementById('res-original').innerText = price.toFixed(2);
      document.getElementById('res-saved').innerText = '- ' + saved.toFixed(2);
      document.getElementById('res-final').innerText = finalPrice.toFixed(2);

      document.getElementById('results').style.display = 'block';
    }
  </script>
</body>
</html>
