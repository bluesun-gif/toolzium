<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age Calculator | Toolzium</title>
  <meta name="description" content="Calculate your exact age in years, months, and days. Find out the countdown to your next birthday.">
  <link rel="stylesheet" href="/css/style.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Age Calculator",
    "description": "Calculate your exact age and next birthday countdown.",
    "applicationCategory": "CalculatorApplication"
  }
  </script>
  <style>
    .calculator-container { max-width: 600px; margin: 40px auto; padding: 30px; background: #fff; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); font-family: system-ui, sans-serif; text-align: center; }
    .input-group { margin: 20px 0; }
    input[type="date"] { padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 1.1rem; width: 100%; max-width: 300px; }
    button { padding: 12px 30px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1.1rem; font-weight: 600; margin-top: 15px; transition: background 0.3s; }
    button:hover { background: #0056b3; }
    .result-box { margin-top: 30px; padding: 20px; background: #f8f9fa; border-radius: 8px; display: none; }
    .exact-age { font-size: 2rem; font-weight: bold; color: #333; margin-bottom: 10px; }
    .age-details { font-size: 1.2rem; color: #555; }
    .next-bday { margin-top: 20px; font-size: 1.1rem; color: #007bff; font-weight: 600; padding-top: 20px; border-top: 1px solid #eee; }
  </style>
</head>
<body>
  <header>
    <div class="navbar">
      <a href="/" class="logo">Toolzium</a>
      <nav class="nav-links">
        <a href="/pdf/">PDF</a>
        <a href="/image/">Image</a>
        <a href="/text/">Text</a>
        <a href="/developer/">Developer</a>
        <a href="/calculator/">Calculator</a>
        <a href="/converter/">Converter</a>
        <a href="/ai/">AI Tools</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="calculator-container">
      <h1>Age Calculator</h1>
      <p>Enter your date of birth to calculate your exact age.</p>
      
      <div class="input-group">
        <input type="date" id="dob" max="">
      </div>
      <button onclick="calculateAge()">Calculate Age</button>

      <div class="result-box" id="result-box">
        <div class="exact-age" id="exact-age"></div>
        <div class="age-details" id="age-details"></div>
        <div class="next-bday" id="next-bday"></div>
      </div>
    </div>
  </main>

  <footer>
    <div class="privacy-badge">🔒 Your data never leaves your device.</div>
    <div class="footer-links">
      <a href="/">Home</a><a href="/about.html">About</a><a href="/privacy.html">Privacy</a>
    </div>
    <p class="copyright">&copy; 2026 Toolzium. All rights reserved.</p>
  </footer>

  <script>
    // Set max date to today
    document.getElementById('dob').max = new Date().toISOString().split("T")[0];

    function calculateAge() {
      const dobInput = document.getElementById('dob').value;
      if(!dobInput) return alert("Please select a date of birth");

      const dob = new Date(dobInput);
      const today = new Date();

      if(dob > today) return alert("Date of birth cannot be in the future!");

      let years = today.getFullYear() - dob.getFullYear();
      let months = today.getMonth() - dob.getMonth();
      let days = today.getDate() - dob.getDate();

      if(days < 0) {
        months--;
        const lastMonth = new Date(today.getFullYear(), today.getMonth(), 0);
        days += lastMonth.getDate();
      }
      if(months < 0) {
        years--;
        months += 12;
      }

      document.getElementById('exact-age').innerText = `${years} Years`;
      document.getElementById('age-details').innerText = `${months} months and ${days} days`;

      // Next Birthday
      let nextBday = new Date(today.getFullYear(), dob.getMonth(), dob.getDate());
      if(today > nextBday && (today.getMonth() !== dob.getMonth() || today.getDate() !== dob.getDate())) {
        nextBday.setFullYear(nextBday.getFullYear() + 1);
      }
      
      const diffTime = Math.abs(nextBday - today);
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      
      let bdayStr = diffDays === 0 ? "Today is your birthday! 🎉" : `${diffDays} days until your next birthday.`;
      document.getElementById('next-bday').innerText = bdayStr;

      document.getElementById('result-box').style.display = 'block';
    }
  </script>
</body>
</html>
