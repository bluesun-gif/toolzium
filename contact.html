<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Toolzium</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="navbar-wrap">
  <div class="navbar">
    <a href="/" class="logo">
      <svg viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="6" fill="#FF5252"/><path d="M7 8h14v2H7zm3 4h8v2h-8zm2 4h4v2h-4z" fill="#fff"/></svg>
      Toolzium
    </a>
    <nav class="nav-links" id="navLinks">
      <a href="/index.html#pdf-tools" class="nav-item">PDF Tools</a>
      <a href="/index.html#text-tools" class="nav-item">Text Tools</a>
      <a href="/index.html#dev-tools" class="nav-item">Developer</a>
    </nav>
  </div>
</header>

<main class="tool-page" style="max-width: 600px; padding: 40px 24px;">
  <div class="tool-hero" style="border-bottom:none; margin-bottom: 20px; padding: 24px 0 12px;">
    <h1>Contact Us</h1>
    <p>Have questions, feedback, or tool requests? Get in touch with us.</p>
  </div>

  <div class="tool-container" style="text-align: left; padding: 28px;">
    <form onsubmit="event.preventDefault(); alert('Message sent! We will get back to you soon.'); this.reset();">
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" required placeholder="Enter your name">
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="name@example.com">
      </div>
      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" required placeholder="What is this about?">
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" required placeholder="Type your message here..."></textarea>
      </div>
      <button class="btn btn-primary btn-block btn-lg" type="submit" style="margin-top: 8px;">
        Send Message
      </button>
    </form>
  </div>
</main>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <a href="/" class="logo"><svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="6" fill="#FF5252"/><path d="M7 8h14v2H7zm3 4h8v2h-8zm2 4h4v2h-4z" fill="#fff"/></svg>Toolzium</a>
      <p>50+ free browser-based tools. No signup, no uploads — 100% private.</p>
    </div>
  </div>
  <div class="footer-bottom">
    <p>© 2026 Toolzium. All rights reserved.</p>
  </div>
</footer>

</body>
</html>
